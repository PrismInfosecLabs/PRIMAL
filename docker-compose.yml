services:
  # ClamAV container
  clamav-scanner:
    build:
      context: .
      dockerfile: Dockerfile.clamav
    volumes:
      - shared-files:/app/shared-files:rw,nosuid,nodev
      - clamav-db:/var/lib/clamav:rw,nosuid,nodev
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_BREAK_SYSTEM_PACKAGES=1
    networks:
      - malware-analysis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    expose:
      - "5000"
    # Add security options for Ubuntu 24.04 compatibility
    security_opt:
      - apparmor:unconfined
    # Disable user namespace remapping for this container if needed
    userns_mode: "host"

  # Orchestrator
  orchestrator:
    build: 
      context: .
      dockerfile: Dockerfile.orchestrator
    depends_on:
      clamav-scanner:
        condition: service_healthy
    ports:
      - "8080:8080" 
    volumes:
      # Use explicit user mapping to handle permission issues
      - ./uploads:/app/uploads:rw,nosuid,nodev
      - ./reports:/app/reports:rw,nosuid,nodev
      - ./rules:/app/rules:rw,nosuid,nodev
      - ./data:/app/data:rw,nosuid,nodev
      - ./logs:/app/logs:rw,nosuid,nodev
      - ./test-samples:/app/test-samples:rw,nosuid,nodev
      - ./templates:/app/templates:rw,nosuid,nodev
      - shared-files:/app/shared-files:rw,nosuid,nodev
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_BREAK_SYSTEM_PACKAGES=1
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - HYBRID_ANALYSIS_API_KEY=${HYBRID_ANALYSIS_API_KEY}
      - METADEFENDER_API_KEY=${METADEFENDER_API_KEY}
      - CLAMAV_URL=http://clamav-scanner:5000
    networks:
      - malware-analysis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    # Add security options for Ubuntu 24.04 compatibility
    security_opt:
      - apparmor:unconfined
    # Use host user namespace to avoid permission issues
    user: "1000:1001"

volumes:
  shared-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./shared-files
  clamav-db:
    driver: local

networks:
  malware-analysis:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"